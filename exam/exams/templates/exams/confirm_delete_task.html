{% extends "exams/base.html" %}

{% block content %}
<h2>Подтверждение удаления задачи</h2>

<p>Вы уверены, что хотите удалить задачу <strong>{{ task.name }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'exams:tasks' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
